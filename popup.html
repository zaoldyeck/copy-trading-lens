<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Copy Trading Lens</title>
    <link rel="stylesheet" href="src/popup.css">
  </head>
  <body>
    <main class="popup">
      <header>
        <img src="assets/icons/icon48.png" alt="" width="40" height="40">
        <div>
          <p>Copy Trading Lens</p>
          <h1>跟單員即時風控分析</h1>
        </div>
      </header>

      <section>
        <h2>使用方式</h2>
        <p>打開 Binance 或 OKX 的個別跟單員頁面，右側會自動出現分析面板。面板只使用目前頁面可取得的資料，並在你的瀏覽器本機計算。</p>
      </section>

      <section>
        <h2>它會檢查什麼</h2>
        <ul>
          <li>類馬丁 / 逆勢加倉與虧損持倉拖延</li>
          <li>虧損期補保證金與目前浮虧死扛</li>
          <li>盈虧比、期望值、交易樣本與 MDD</li>
          <li>高頻微利策略的滑價與可複製性</li>
        </ul>
      </section>

      <section class="notice">
        <h2>隱私</h2>
        <p>不收集、不上傳、不儲存 cookie、header、API key 或帳戶資料。沒有後端服務。</p>
      </section>
    </main>
  </body>
</html>
